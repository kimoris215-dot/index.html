<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelConsult Pro - ABI 16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; }
        .sidebar { background: #0f172a; border-right: 1px solid #1e293b; transition: all 0.3s; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { background: #1e1b4b; color: #818cf8; border-left: 4px solid #818cf8; }
        .page-content { display: none; }
        .page-active { display: block; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <aside class="w-20 md:w-64 sidebar flex flex-col h-full">
        <div class="p-6 text-center border-b border-slate-800">
            <h1 class="hidden md:block font-black text-indigo-400 tracking-tighter">NOVELCONSULT</h1>
            <span class="md:hidden text-xl">✍️</span>
        </div>
        <nav class="flex-grow py-4">
            <button onclick="switchPage('home')" id="nav-home" class="w-full flex items-center p-4 active-tab hover:bg-slate-800 transition">
                <span class="text-xl md:mr-3">🏠</span> <span class="hidden md:block text-sm font-bold">Beranda / Plot</span>
            </button>
            <button onclick="switchPage('characters')" id="nav-characters" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 transition">
                <span class="text-xl md:mr-3">👥</span> <span class="hidden md:block text-sm font-bold">Karakter & Dunia</span>
            </button>
            <button onclick="switchPage('timeline')" id="nav-timeline" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 transition">
                <span class="text-xl md:mr-3">⏳</span> <span class="hidden md:block text-sm font-bold">Timeline Cerita</span>
            </button>
            <button onclick="switchPage('profile')" id="nav-profile" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 transition">
                <span class="text-xl md:mr-3">⚙️</span> <span class="hidden md:block text-sm font-bold">Profil & Bahasa</span>
            </button>
        </nav>
