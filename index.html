<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelConsult Pro</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NovelConsult">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Righteous&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Tambahan untuk Fitur Baru */
        :root {
            --green: #7ED321; --purple: #6B21E8; --bg: #F0EDFA; --dark: #1a0a3b;
        }
        body { background: var(--bg); font-family: 'Nunito', sans-serif; }
        
        .profile-img-preview {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--green); background: #eee;
        }
        
        .history-item {
            background: white; padding: 12px; border-radius: 12px; margin-bottom: 8px;
            border-left: 4px solid var(--purple); cursor: pointer; transition: 0.2s;
        }
        .history-item:hover { transform: translateX(5px); background: #fdfbff; }

        .setting-detail-box {
            background: #f8faff; border: 1px solid #e0e7ff; border-radius: 15px;
            padding: 15px; margin-top: 10px; line-height: 1.6; font-size: 0.85rem;
        }
        
        .char-box {
            border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; margin-bottom: 8px;
        }
        
        .install-banner {
            display: none; background: var(--dark); color: white; padding: 10px;
            position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 1000;
            border-radius: 15px; align-items: center; justify-content: space-between;
        }
    </style>
</head>
<body>

<nav class="bg-[#6B21E8] text-white p-3 flex justify-between items-center fixed top-0 w-full z-50 shadow-lg">
    <div class="font-['Righteous'] text-xl" onclick="goHome()">✍️ NovelConsult</div>
    <div class="flex items-center gap-3">
        <button onclick="showHistory()" class="text-xs font-bold bg-white/20 px-3 py-1 rounded-full">🕒 Histori</button>
        <div id="nav-profile-img" onclick="openProfile()" class="w-9 h-9 rounded-full bg-green-400 border-2 border-white overflow-hidden cursor-pointer flex items-center justify-center font-bold text-dark">
            ?
        </div>
    </div>
</nav>

<div id="install-banner" class="install-banner">
    <span class="text-xs font-bold">Simpan di Layar Utama?</span>
    <button onclick="installApp()" class="bg-green-500 text-dark px-4 py-1 rounded-full text-xs font-black">Install</button>
</div>

<div id="page-home" class="pt-20 px-4 max-w-md mx-auto flex flex-col gap-5">
    <div class="bg-[#6B21E8] p-6 rounded-[2.5rem] text-white shadow-xl">
        <h1 class="font-['Righteous'] text-3xl">Mulai Menulis</h1>
        <p class="text-sm opacity-80">Rancang dunia fantasimu hari ini.</p>
    </div>

    <div class="bg-white p-5 rounded-[2.5rem] shadow-sm flex flex-col gap-4">
        <textarea id="user-idea" class="w-full border-2 border-purple-100 rounded-2xl p-4 text-sm font-bold focus:border-purple-400 outline-none" rows="4" placeholder="Apa premis ceritamu hari ini?"></textarea>
        <select id="genre-select" class="w-full border-2 border-purple-100 rounded-xl p-3 text-sm font-bold">
            <option value="Fantasi">🧙 Fantasi</option>
            <option value="Romansa">💕 Romansa</option>
            <option value="Misteri">🕵️ Misteri</option>
        </select>
        <button onclick="generateOutline()" class="bg-[#7ED321] text-dark font-black py-4 rounded-full shadow-lg active:scale-95 transition">⚡ BANGUN OUTLINE</button>
    </div>
</div>

<div id="page-history" class="hidden pt-20 px-4 max-w-md mx-auto">
    <div class="flex justify-between items-center mb-5">
        <h2 class="font-['Righteous'] text-2xl text-purple-900">Histori Cerita</h2>
        <button onclick="goHome()" class="text-sm font-bold text-purple-600">Tutup</button>
    </div>
    <div id="history-list"></div>
</div>

<div id="page-result" class="hidden pt-20 px-4 pb-20 max-w-md mx-auto">
    <button onclick="goHome()" class="mb-4 font-bold text-purple-600">← Kembali</button>
    <div id="display-chapters" class="flex flex-col gap-4"></div>
</div>

<div id="profile-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[100]
