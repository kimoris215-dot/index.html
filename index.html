<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelConsult Pro - ABI 16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; padding-bottom: 100px; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .chapter-card { cursor: pointer; border-left: 4px solid #334155; transition: 0.3s; }
        .chapter-card:hover { border-left-color: #6366f1; background: rgba(99, 102, 241, 0.05); }
        .detail-content { display: none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .open { display: block !important; }
    </style>
</head>
<body>

    <div class="p-4 md:p-8 max-w-3xl mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-4xl font-black text-indigo-400 italic tracking-tighter uppercase">NovelConsult ✍️</h1>
            <p class="text-slate-500 text-[10px] tracking-[0.3em] uppercase font-bold">Deep Narrative Architect - ABI 16</p>
        </header>

        <div class="glass p-8 rounded-[2.5rem] space-y-6 shadow-2xl border-t border-white/5">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-indigo-400 uppercase ml-2">Premis atau Ide Utama</label>
                <textarea id="user-idea" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-5 text-sm outline-none focus:border-indigo-500" placeholder="Masukkan ide cerita kamu..."></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <select id="total-chapters" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm outline-none">
                    <option value="5">5 Bab (Singkat)</option>
                    <option value="10">10 Bab (Sedang)</option>
                    <option value="20">20 Bab (Panjang)</option>
                </select>
                <button onclick="generateDeepOutline()" class="accent-gradient rounded-2xl font-bold text-xs tracking-widest uppercase py-4">Generate Detail</button>
            </div>
        </div>

        <div id="result-section" class="hidden space-y-6">
            <h3 class="text-xs font-black text-indigo-400 uppercase tracking-widest px-4 italic underline decoration-indigo-500 underline-offset-8">Master Plot & Character Bible (Klik tiap Bab)</h3>
            <div id="display-chapters" class="space-y-5"></div>
        </div>
    </div>

    <script>
        function generateDeepOutline() {
            const idea = document.getElementById('user-idea').value;
            const count = parseInt(document.getElementById('total-chapters').value);
            if(!idea) return alert("Isi ide ceritanya dulu!");

            document.getElementById('result-section').classList.remove('hidden');
            const list = document.getElementById('display-chapters');
            list.innerHTML = "";

            for(let i=1; i<=count; i++) {
                const div = document.createElement('div');
                div.className = "glass p-6 rounded-[2rem] chapter-card";
                div.onclick = function() { 
                    const content = this.querySelector('.detail-content');
                    content.classList.toggle('open');
                };

                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-lg">BAB ${i}: Eksplorasi Keajaiban</h4>
                        <span class="text-slate-600">▼</span>
                    </div>
                    
                    <div class="detail-content text-sm text-slate-300 space-y-6">
                        <div>
                            <h5 class="text-[10px] font-black text-purple-400 uppercase border-b border-purple-900 pb-1 mb-3">Daftar Tokoh & Sifat</h5>
                            <div class="grid gap-3">
                                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                                    <p class="font-bold text-indigo-300">Tokoh Utama (Mahasiswa)</p>
                                    <p class="text-xs text-slate-400 mt-1">Sifat: Penasaran tinggi, cerdas, namun terkadang ceroboh. Memiliki motivasi kuat untuk mengungkap misteri rumah tua tersebut.</p>
                                </div>
                                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                                    <p class="font-bold text-indigo-300">Penjaga Rahasia / Antagonis</p>
                                    <p class="text-xs text-slate-400 mt-1">Sifat: Dingin, manipulatif, dan memiliki kekuatan magis. Berusaha menghalangi tokoh utama masuk lebih jauh.</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h5 class="text-[10px] font-black text-indigo-400 uppercase border-b border-indigo-900 pb-1 mb-3">Rangkaian Kejadian Detail</h5>
                            <ul class="space-y-4 text-[13px] leading-relaxed">
                                <li>• <b>Tahap Awal:</b> Tokoh utama menemukan petunjuk fisik pertama (seperti kunci kuno atau simbol di lantai) yang bergetar saat didekati, menandakan adanya energi dari "${idea.substring(0, 30)}...".</li>
                                <li>• <b>Konflik Tengah:</b> Terjadi dialog menegangkan di mana tokoh utama hampir tertangkap oleh entitas dari dunia lain. Deskripsi suasana dibuat sangat mencekam untuk membangun horor/fantasi.</li>
                                <li>• <b>Puncak Bab:</b> Pintu rahasia di bawah tanah akhirnya terbuka sedikit, memancarkan cahaya yang tidak masuk akal secara logika mahasiswa tersebut.</li>
                                <li>• <b>Penutup:</b> Bab berakhir dengan keputusan besar tokoh utama untuk melangkah masuk, meski ia tahu nyawanya mungkin terancam.</li>
                            </ul>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            }
            window.scrollTo({ top: document.getElementById('result-section').offsetTop - 20, behavior: 'smooth' });
        }
    </script>
</body>
</html>
