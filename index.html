<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelConsult Pro - Deep Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; padding-bottom: 100px; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .chapter-card { cursor: pointer; transition: all 0.3s ease; border-left: 4px solid #334155; }
        .chapter-card:hover { border-left-color: #6366f1; background: rgba(99, 102, 241, 0.05); }
        .detail-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .detail-content.open { max-height: 1500px; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="p-4 md:p-8 max-w-3xl mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-4xl font-black text-indigo-400 italic tracking-tighter uppercase">NovelConsult ✍️</h1>
            <p class="text-slate-500 text-[10px] tracking-[0.3em] uppercase font-bold">Deep Narrative Architect - ABI 16</p>
        </header>

        <div class="glass p-8 rounded-[2.5rem] space-y-6 shadow-2xl border-t border-white/5">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-indigo-400 uppercase ml-2">Premis atau Ide Utama</label>
                <textarea id="user-idea" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-5 text-sm outline-none focus:border-indigo-500 transition-all leading-relaxed" placeholder="Contoh: Seorang mahasiswa menemukan pintu rahasia di rumah tua yang membawanya ke dunia fantasi penuh misteri..."></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-2">Durasi Cerita</label>
                    <select id="total-chapters" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm outline-none">
                        <option value="5">5 Bab (Flash Fiction)</option>
                        <option value="10">10 Bab (Novelet)</option>
                        <option value="20">20 Bab (Novel Lengkap)</option>
                    </select>
                </div>
                <button onclick="generateDeepOutline()" class="accent-gradient rounded-2xl font-bold text-xs tracking-widest uppercase shadow-lg shadow-indigo-500/20 active:scale-95 transition-all mt-6">Generate Detail</button>
            </div>
        </div>

        <div id="result-section" class="hidden space-y-6">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-xs font-black text-indigo-400 uppercase tracking-widest italic underline decoration-indigo-500 underline-offset-8">Master Plot & Character Bible</h3>
            </div>

            <div id="display-chapters" class="space-y-5 pt-4"></div>
        </div>
    </div>

    <script>
        function generateDeepOutline() {
            const idea = document.getElementById('user-idea').value;
            const count = parseInt(document.getElementById('total-chapters').value);

            if(!idea) return alert("Mohon deskripsikan ide cerita kamu agar rincian bisa dibuat!");

            document.getElementById('result-section').classList.remove('hidden');
            const list = document.getElementById('display-chapters');
            list.innerHTML = "";

            for(let i=1; i<=count; i++) {
                let stage = i === 1 ? "ORIENTASI" : i === count ? "RESOLUSI" : i > count/2 ? "PUNCAK KONFLIK" : "AKSI MENINGKAT";
                
                const div = document.createElement('div');
                div.className = "glass p-6 rounded-[2rem] chapter-card";
                div.onclick = function() {
                    const detail = this.querySelector('.detail-content');
                    detail.classList.toggle('open');
                    this.querySelector('.arrow-icon').classList.toggle('rotate-180');
                };

                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <span class="text-[9px] font-black text-indigo-500 uppercase tracking-[0.2em]">${stage}</span>
                            <h4 class="font-bold text-lg tracking-tight">BAB ${i}: Langkah Menuju "${idea.substring(0, 15)}..."</h4>
                        </div>
                        <span class="arrow-icon transition-transform duration-300 text-slate-600 text-lg">▼</span>
                    </div>
                    
                    <div class="detail-content text-sm text-slate-300 space-y-6">
                        <div class="space-y-3">
                            <h5 class="text-[10px] font-black text-purple-400 uppercase tracking-widest border-b border-purple-900/50 pb-1">Karakter dalam Bab Ini</h5>
                            <div class="grid grid-cols-1 md:grid
