<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelConsult - Deep Outline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; padding-bottom: 100px; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-page { display: none; }
        .nav-active { color: #818cf8; }
        .accent-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .card-inner { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <div id="home-page" class="p-4 md:p-8 max-w-2xl mx-auto space-y-6">
        <header class="text-center py-4">
            <h1 class="text-3xl font-black text-indigo-400 italic tracking-tighter">NovelConsult DEEP ✍️</h1>
            <p class="text-slate-500 text-[10px] tracking-[0.2em] uppercase">Detailed Story Architect</p>
        </header>

        <div class="glass p-6 rounded-[2rem] space-y-5 shadow-2xl">
            <textarea id="user-idea" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500" placeholder="Jelaskan ide cerita kamu selengkap mungkin..."></textarea>
            
            <div class="grid grid-cols-2 gap-3">
                <select id="total-chapters" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none">
                    <option value="5">5 Bab (Singkat)</option>
                    <option value="10">10 Bab (Sedang)</option>
                    <option value="20">20 Bab (Panjang)</option>
                </select>
                <button onclick="generate()" class="accent-gradient rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all">GENERATE DETAIL</button>
            </div>
        </div>

        <div id="result-section" class="hidden space-y-6">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Master Outline Detail</h3>
                <button onclick="copyAll()" class="text-[10px] bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700">Copy Result</button>
            </div>

            <div id="final-content" class="space-y-6">
                <div class="glass p-6 rounded-[2rem] border-t-4 border-purple-500">
                    <h4 class="text-indigo-400 font-bold text-sm mb-4">🏠 SETTING & CHARACTER BIBLE</h4>
                    <div id="display-bible" class="text-xs text-slate-300 leading-relaxed space-y-2"></div>
                </div>

                <div id="display-chapters" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="profile-page" class="hidden-page p-8 max-w-2xl mx-auto">
        <div class="glass p-8 rounded-[2rem] text-center space-y-6">
            <div class="w-20 h-20 bg-indigo-600 rounded-full mx-auto flex items-center justify-center text-3xl">👤</div>
            <h2 class="text-xl font-bold">Penulis ABI 16</h2>
            <div class="text-left space-y-4 pt-4 border-t border-slate-800">
                <label class="text-[10px] text-slate-500 font-bold uppercase">Language</label>
                <select class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
                    <option>Bahasa Indonesia</option>
                    <option>English</option>
                </select>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800 flex justify-around items-center h-20 z-50">
        <button onclick="nav('home')" id="nav-home" class="flex flex-col items-center nav-active">
            <span class="text-2xl">🏠</span><span class="text-[9px] mt-1 font-bold">HOME</span>
        </button>
        <button onclick="nav('profile')" id="nav-profile" class="flex flex-col items-center text-slate-600">
            <span class="text-2xl">⚙️</span><span class="text-[9px] mt-1 font-bold">PROFILE</span>
        </button>
    </nav>

    <script>
        function nav(p) {
            document.getElementById('home-page').classList.toggle('hidden-page', p !== 'home');
            document.getElementById('profile-page').classList.toggle('hidden-page', p !== 'profile');
            document.getElementById('nav-home').classList.toggle('nav-active', p === 'home');
            document.getElementById('nav-profile').classList.toggle('nav-active', p === 'profile');
        }

        function generate() {
            const idea = document.getElementById('user-idea').value;
            const count = document.getElementById('total-chapters').value;
            if(!idea) return alert("Tuliskan ide ceritanya dulu!");

            document.getElementById('result-section').classList.remove('hidden');
            
            // Build Bible
            document.getElementById('display-bible').innerHTML = `
                <p><b>Latar Tempat:</b> Dunia yang terinspirasi dari "${idea.substring(0, 20)}..." dengan kontras emosional yang kuat.</p>
                <p><b>Tokoh Utama:</b> Seorang yang ambisius namun menyimpan trauma, dipaksa menghadapi realita dalam alur ini.</p>
                <p><b>Tema Utama:</b> Perjuangan, Identitas, dan Konsekuensi dari pilihan.</p>
            `;

            // Build Chapters
            const list = document.getElementById('display-chapters');
            list.innerHTML = "";
            
            for(let i=1; i<=count; i++) {
                let phase = i <= count/3 ? "PENGENALAN" : i <= (count*2)/3 ? "KONFLIK" : "RESOLUSI";
                const div = document.createElement('div');
                div.className = "glass p-6 rounded-[2rem] card-inner";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[10px] font-black text-indigo-500 uppercase tracking-tighter">BAB ${i} - ${phase}</span>
                        <span class="text-[10px] text-slate-600 italic">Est. 1500 Kata</span>
                    </div>
                    <div class="space-y-3">
                        <p class="text-sm font-bold text-slate-200">Inti Kejadian:</p>
                        <p class="text-xs text-slate-400 leading-relaxed">Pada bab ini, fokus utama adalah mengeksplorasi bagaimana "${idea.substring(0, 30)}..." mulai mempengaruhi lingkungan sekitar tokoh. Terjadi pertemuan kunci yang mengubah perspektif tokoh utama secara drastis.</p>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <div class="p-2 rounded-lg bg-indigo-500/5 border border-indigo-500/10">
                                <p class="text-[9px] font-bold text-indigo-400 uppercase">Tujuan (Goal)</p>
                                <p class="text-[10px] text-slate-300">Menciptakan urgensi bagi tokoh untuk bertindak cepat.</p>
                            </div>
                            <div class="p-2 rounded-lg bg-purple-500/5 border border-purple-500/10">
                                <p class="text-[9px] font-bold text-purple-400 uppercase">Ketegangan</p>
                                <p class="text-[10px] text-slate-300">Meningkat seiring rahasia masa lalu mulai terkuak.</p>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            }
            window.scrollTo({ top: document.getElementById('result-section').offsetTop, behavior: 'smooth' });
        }

        function copyAll() {
            const text = document.getElementById('final-content').innerText;
            navigator.clipboard.writeText(text);
            alert("Outline Super Detail Berhasil Disalin!");
        }
    </script>
</body>
</html>
