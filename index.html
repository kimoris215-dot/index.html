<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelConsult Pro-Author</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .sidebar { background: #0f172a; border-right: 1px solid #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { background: #1e1b4b; color: #818cf8; border-left: 4px solid #818cf8; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <aside class="w-16 md:w-64 sidebar flex flex-col transition-all">
        <div class="p-6 text-center border-b border-slate-800">
            <h1 class="hidden md:block font-black text-indigo-400 tracking-tighter">NOVELCONSULT PRO</h1>
            <span class="md:hidden text-xl">✍️</span>
        </div>
        <nav class="flex-grow py-4 overflow-y-auto">
            <button onclick="showPage('home')" id="btn-home" class="w-full flex items-center p-4 active-tab hover:bg-slate-800 transition">
                <span class="text-xl mr-3">🏠</span> <span class="hidden md:block text-sm font-bold">Beranda / Plot</span>
            </button>
            <button onclick="showPage('characters')" id="btn-characters" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 transition">
                <span class="text-xl mr-3">👥</span> <span class="hidden md:block text-sm font-bold">Karakter & Dunia</span>
            </button>
            <button onclick="showPage('timeline')" id="btn-timeline" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 transition">
                <span class="text-xl mr-3">⏳</span> <span class="hidden md:block text-sm font-bold">Timeline Cerita</span>
            </button>
            <button onclick="showPage('profile')" id="btn-profile" class="w-full flex items-center p-4 text-slate-400 hover:bg-slate-800 transition">
                <span class="text-xl mr-3">⚙️</span> <span class="hidden md:block text-sm font-bold">Profil & Bahasa</span>
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="exportDoc()" class="w-full bg-indigo-600 p-2 rounded-lg text-xs font-bold">EXPORT PDF/DOCX</button>
        </div>
    </aside>

    <main class="flex-grow overflow-y-auto p-4 md:p-10">
        
        <section id="page-home" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-6 rounded-3xl space-y-4">
                    <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">1. Brainstorming</h3>
                    <textarea id="user-idea" rows="4" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500" placeholder="Apa ide besarnya?"></textarea>
                    <div class="flex gap-2">
                        <select id="total-chapters" class="bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs">
                            <option value="5">5 Bab</option><option value="10">10 Bab</option><option value="20">20 Bab</option>
                        </select>
                        <button onclick="generatePlot()" class="flex-grow bg-indigo-600 rounded-xl font-bold text-xs">GENERATE OUTLINE</button>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <h3 class="text-xs font-bold text-purple-400 uppercase tracking-widest mb-4">2. Corkboard (Scene Cards)</h3>
                    <div id="corkboard" class="grid grid-cols-2 gap-2">
                        <div class="p-3 bg-slate-800/50 border border-dashed border-slate-700 rounded-xl text-[10px] text-slate-500 text-center">Belum ada adegan. Klik Generate!</div>
                    </div>
                </div>
            </div>

            <div id="plot-result" class="hidden space-y-4">
                <h3 class="text-sm font-bold border-l-4 border-indigo-500 pl-3">DRAF ALUR TERPERINCI</h3>
                <div id="chapters-list" class="space-y-4"></div>
            </div>
        </section>

        <section id="page-characters" class="hidden space-y-6">
